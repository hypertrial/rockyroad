name: rockyroad

services:
  caddy:
    image: caddy:2.10.0-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - ./apps/web/public:/srv/web/public:ro
      - ./data/maps:/srv/maps:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      ROCKYROAD_DUCKDB_PATH: /state/rockyroad.duckdb
      ROCKYROAD_GEO_DIR: /data/geo
      ROCKYROAD_MAPS_DIR: /data/maps
      ROCKYROAD_OSM_DIR: /data/osm
      ROCKYROAD_ROUTING_DIR: /data/routing/valhalla
      ROCKYROAD_API_HOST: 0.0.0.0
      ROCKYROAD_API_PORT: 8000
      ROCKYROAD_PROVIDER_MODE: ${ROCKYROAD_PROVIDER_MODE:-hosted}
      ROCKYROAD_ORS_API_KEY: ${ROCKYROAD_ORS_API_KEY:-}
      ROCKYROAD_ORS_BASE_URL: ${ROCKYROAD_ORS_BASE_URL:-https://api.heigit.org/openrouteservice}
      ROCKYROAD_ORS_OPTIMIZATION_URL: ${ROCKYROAD_ORS_OPTIMIZATION_URL:-https://api.heigit.org/vroom/v0/optimization}
      ROCKYROAD_PHOTON_URL: ${ROCKYROAD_PHOTON_URL:-https://photon.komoot.io}
      ROCKYROAD_PHOTON_USER_AGENT: ${ROCKYROAD_PHOTON_USER_AGENT:-RockyRoad/0.1 (personal Canada+USA road-trip planner)}
      ROCKYROAD_OPENFREEMAP_STYLE_URL: ${ROCKYROAD_OPENFREEMAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      VALHALLA_URL: http://valhalla:8002
    volumes:
      - rockyroad-state:/state
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - internal

  valhalla:
    profiles: ["local"]
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      use_tiles_ignore_pbf: "True"
      serve_tiles: "True"
      force_rebuild: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      use_default_speeds_config: "False"
      tile_urls: ""
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ${ROCKYROAD_VALHALLA_FILES:-./data/routing/valhalla}:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/status')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  rockyroad-state:
