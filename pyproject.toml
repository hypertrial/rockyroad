[project]
name = "rockyroad"
version = "0.1.0"
description = "Canada + USA road-trip planner with hosted OpenFreeMap/ORS/Photon and a local PEI fallback"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Hypertrial" }]
dependencies = [
    "duckdb==1.3.2",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "polars==1.32.3",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "pyyaml==6.0.2",
    "typer==0.16.0",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pyright==1.1.403",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.9",
]

[project.scripts]
rockyroad-data = "rockyroad_data.cli:app"
rockyroad-api = "rockyroad_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["services/api/src"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"services/api/src/rockyroad_api" = "rockyroad_api"
"services/api/src/rockyroad_data" = "rockyroad_data"

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["services/api/src", "services/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
pythonpath = ["services/api/src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
include = ["services/api/src", "services/api/tests"]
extraPaths = ["services/api/src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
